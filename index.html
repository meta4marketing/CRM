<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NI CRM</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container-fluid py-4">

<div class="row mb-4">

<div class="col-lg-8">
<h2 class="fw-bold">
<i class="bi bi-people-fill"></i>
NI CRM
</h2>
<p class="text-muted">
Lead Management System
</p>
</div>

<div class="col-lg-4 text-lg-end">

<button class="btn btn-success me-2" id="importBtn">

<i class="bi bi-upload"></i>

Import CSV

</button>

<button class="btn btn-primary" id="exportBtn">

<i class="bi bi-download"></i>

Export CSV

</button>

<input
type="file"
id="csvFile"
accept=".csv"
hidden>

</div>

</div>

<!-- Dashboard -->

<div class="row g-3 mb-4">

<div class="col-6 col-md-4 col-xl">

<div class="card dashboard-card total-card">

<div class="card-body text-center">

<h6>Total Leads</h6>

<h2 id="totalLead">0</h2>

</div>

</div>

</div>

<div class="col-6 col-md-4 col-xl">

<div class="card dashboard-card future-card">

<div class="card-body text-center">

<h6>Contact in Future</h6>

<h2 id="futureLead">0</h2>

</div>

</div>

</div>

<div class="col-6 col-md-4 col-xl">

<div class="card dashboard-card negotiation-card">

<div class="card-body text-center">

<h6>Negotiation</h6>

<h2 id="negotiationLead">0</h2>

</div>

</div>

</div>

<div class="col-6 col-md-4 col-xl">

<div class="card dashboard-card proposal-card">

<div class="card-body text-center">

<h6>Proposal Sent</h6>

<h2 id="proposalLead">0</h2>

</div>

</div>

</div>

<div class="col-6 col-md-4 col-xl">

<div class="card dashboard-card call-card">

<div class="card-body text-center">

<h6>Call Attempted</h6>

<h2 id="callLead">0</h2>

</div>

</div>

</div>

</div>

<!-- Search -->

<div class="card shadow-sm mb-4">

<div class="card-body">

<div class="row g-3">

<div class="col-lg-6">

<input
type="text"
class="form-control"
id="searchInput"
placeholder="Search Name or Mobile">

</div>

<div class="col-lg-3">

<select
class="form-select"
id="statusFilter">

<option value="All">All</option>

<option value="Contact in Future">

Contact in Future

</option>

<option value="Negotiation">

Negotiation

</option>

<option value="Proposal Sent">

Proposal Sent

</option>

<option value="Call Attempted">

Call Attempted

</option>

</select>

</div>

<div class="col-lg-3">

<div class="fw-bold">

Showing

<span id="showingLead">

0

</span>

Leads

</div>

</div>

</div>

</div>

</div>

<!-- Lead Form -->

<div class="card shadow mb-4">

<div class="card-header">

<h4>Add / Edit Lead</h4>

</div>

<div class="card-body">

<form id="leadForm">

<input
type="hidden"
id="editId">

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<input
type="text"
class="form-control"
id="name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Mobile</label>

<input
type="text"
class="form-control"
id="mobile"
required>

</div>

<div class="col-md-6 mb-3">

<label>Address</label>

<textarea
class="form-control"
id="address"
rows="3"></textarea>

</div>

<div class="col-md-6 mb-3">

<label>Next Follow-up Date</label>

<input
type="date"
class="form-control"
id="followup">

</div>

<div class="col-12 mb-3">

<label>Notes</label>

<textarea
class="form-control"
id="notes"
rows="4"></textarea>

</div>

<div class="col-12">

<button
type="submit"
class="btn btn-primary">

<i class="bi bi-floppy"></i>

Save Lead

</button>

<button
type="reset"
class="btn btn-secondary ms-2">

Reset

</button>

</div>

</div>

</form>

</div>

</div>

<!-- Lead Cards -->

<div
class="row g-4"
id="leadContainer">

</div>
